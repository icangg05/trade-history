name: trade_history
description: "Jurnal trading pribadi — versi mobile Trade History."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigasi
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Jaringan & penyimpanan
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Tampilan
  fl_chart: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.2

  # Berkas: screenshot trade, bukti transfer, PDF laporan
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  cupertino_icons: ^1.0.9
  flutter_image_compress: ^2.5.1
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

  # IBM Plex dibundel, bukan diunduh saat jalan — sama seperti web yang
  # menyajikan fontnya sendiri. Angka selalu memakai Plex Mono.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

# `dart run flutter_launcher_icons` — ikon diambil dari ikon PWA di public/icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  background_color_ios: "#0B0D14"
  adaptive_icon_background: "#0B0D14"
  adaptive_icon_foreground: assets/icon/maskable.png
  adaptive_icon_foreground_inset: 0
